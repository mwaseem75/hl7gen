[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hl7gen"
version = "0.1.0"
description = "Generate, validate, and convert synthetic HL7 v2 test data — no vendor lock-in."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "mwaseem75" }]
dependencies = [
    "hl7apy>=1.3.4",
    "Faker>=20.0.0",
    "fhir.resources>=8.0.0",
    "click>=8.1.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
]

[project.optional-dependencies]
ai = ["anthropic>=0.30.0"]
mcp = ["mcp>=2.0.0"]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0", "httpx>=0.27.0", "mcp>=2.0.0"]

[project.scripts]
hl7gen = "hl7gen.cli:cli"
hl7gen-mcp = "hl7gen.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
